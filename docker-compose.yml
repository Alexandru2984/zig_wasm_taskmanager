# Existing-installation database service. Root identity persists in RocksDB;
# ordinary startup must not expose bootstrap secrets in argv or environment.
# For a NEW empty store only, use docker-compose.bootstrap.yml once and then
# recreate with this file alone. See docs/DATABASE-HARDENING.md.

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    container_name: surrealdb-taskmanager-v3
    restart: unless-stopped
    # The 3.x image runs as a non-root user that cannot create the RocksDB
    # directory inside a fresh bind mount.
    user: root
    entrypoint: ["/surreal"]
    command:
      - start
      - --log
      - info
      # `--auth` was removed in 3.x: authentication is always on, and passing
      # the flag now makes the server refuse to start.
      # `file:` was an alias for rocksdb: and is gone in 3.x.
      - rocksdb:/data/database.db
    volumes:
      - /var/lib/surrealdb-taskmanager-v3:/data
    # Loopback excludes remote clients, not other processes on this host.
    ports:
      - "127.0.0.1:8010:8000"
