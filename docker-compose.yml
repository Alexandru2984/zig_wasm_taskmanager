# task.micutu.com — SurrealDB backing store for the Zig taskmanager
#
# On OVH this ran as a hand-started `docker run`. Recreated here as compose so it
# survives a reboot and is describable. Image pinned by digest to match OVH.
# The data directory is a bind mount, not a named volume, exactly as on OVH.
#
# SECURITY: credentials are never written here. Compose reads them from the
# adjacent .env (git-ignored, mode 0600), the same file the app itself parses,
# so there is exactly one place holding the database password.
# Required keys: SURREAL_USER, SURREAL_PASS.

services:
  surrealdb:
    image: surrealdb/surrealdb@sha256:f4e80018e035fc8f9f4354e5bd9521b22aa8484c336654858cc01ce630bb8f36
    container_name: surrealdb-taskmanager
    restart: unless-stopped
    entrypoint: ["/surreal"]
    command:
      - start
      - --auth
      - --log
      - info
      - --user
      - "${SURREAL_USER:?SURREAL_USER must be set in .env}"
      - --pass
      - "${SURREAL_PASS:?SURREAL_PASS must be set in .env}"
      - file:/data/database.db
    volumes:
      - /var/lib/surrealdb-taskmanager:/data
    # Bound to loopback only: the database is reachable from the host app and
    # nothing else. nginx never proxies to it.
    ports:
      - "127.0.0.1:8010:8000"
