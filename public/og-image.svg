<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Zig Tasks — a fast, shared task manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#14161d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7931a"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0" r="0.8">
      <stop offset="0" stop-color="#f7931a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(96, 150)">
    <text x="0" y="0" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="30" font-weight="600" fill="#9aa3b2" letter-spacing="6">🦎 ZIG TASKS</text>
    <text x="0" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="86" font-weight="750" fill="url(#accent)">Organize your day</text>
    <text x="0" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="36" font-weight="400" fill="#f3f4f6">Shared workspaces · due dates · tags</text>
    <text x="0" y="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="27" font-weight="400" fill="#6b7280">Zig + Zap on the server · WebAssembly in the browser</text>

    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="620" height="62" rx="14" fill="#1b1e27" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="20" y="20" width="22" height="22" rx="7" fill="#22c55e"/>
      <path d="M26 31 l4 4 l8 -9" stroke="#0b0c10" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="39" font-family="system-ui, sans-serif" font-size="24" fill="#9aa3b2">Ship the security audit</text>

      <rect x="0" y="78" width="620" height="62" rx="14" fill="#1b1e27" stroke="#f1556c" stroke-opacity="0.5"/>
      <rect x="20" y="98" width="22" height="22" rx="7" fill="none" stroke="#6b7280" stroke-width="2"/>
      <text x="60" y="117" font-family="system-ui, sans-serif" font-size="24" fill="#f3f4f6">Review the deploy config</text>
      <rect x="452" y="100" width="64" height="26" rx="13" fill="#f1556c" fill-opacity="0.16"/>
      <text x="466" y="118" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f1556c">High</text>
    </g>
  </g>

  <rect x="0" y="618" width="1200" height="12" fill="url(#accent)"/>
</svg>
