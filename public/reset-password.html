<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Zig Tasks password.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
    <title>Reset password — Zig Tasks</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=40776b1a">
</head>
<body class="reset-page">
    <div class="reset-container">
        <div class="reset-header">
            <h1>Reset password</h1>
            <p>Enter your new password below.</p>
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8" placeholder="••••••••">
            </div>
            <div class="form-error" id="resetError" role="alert" aria-live="assertive"></div>
            <div class="form-success hidden" id="resetSuccess">✅ Password reset successfully. Redirecting…</div>
            <button type="submit" class="btn btn-primary btn-block">Reset password</button>
        </form>
    </div>

    <script src="reset-password.js?v=52c0a43a"></script>
</body>
</html>
