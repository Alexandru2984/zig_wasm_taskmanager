# Security headers for task.micutu.com.
# Deploy: sudo cp ops/nginx/task-security.conf /etc/nginx/snippets/
#
# This vhost does NOT include the shared snippets/security-headers.conf.
# That snippet carries a generic policy with script-src 'unsafe-inline' and
# X-Frame-Options SAMEORIGIN, and including it alongside the application's own
# headers produced two of everything on every response:
#
#   x-frame-options: DENY            <- from the Zig app
#   x-frame-options: SAMEORIGIN      <- from the shared snippet
#
# Duplicate CSP headers are merged by the browser into their intersection, so
# that pair happened to fail safe. Conflicting X-Frame-Options values do not
# have defined behaviour, and shipping a header the app spent effort making
# strict next to a looser copy of the same header is a trap for whoever reads
# `curl -I` next.
#
# nginx is the single source of truth instead. It covers responses the app
# never sees (502 when the unit is restarting, 413, 429 from the limit_req
# zones), which per-response headers in the app cannot.

# Drop the upstream's copies so only the values below survive.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# 'wasm-unsafe-eval' is required and sufficient: the front end instantiates a
# Zig-compiled WebAssembly module for the logged-out task store. It permits
# WebAssembly compilation only — it does NOT re-enable eval() or inline script,
# so an injected <script> is still refused.
#
# static.cloudflareinsights.com is the Web Analytics beacon, injected by
# Cloudflare at the edge downstream of nginx. There is nothing to switch off on
# this side: either the policy names the host or every visitor gets a console
# error and the site collects no real-user data. It reports to a second host,
# hence the connect-src entry. One Cloudflare inline script is still refused —
# the Bot Management JS Detections bootstrap, which embeds a fresh ray id per
# request and so can never match a static hash. Allowing it would mean
# 'unsafe-inline', which is most of what this header is for. The cost is one
# console error and weaker bot fingerprinting.
#
# No 'unsafe-inline' anywhere. Every page loads its script and its stylesheet
# as separate files precisely so this stays true, and dynamic styling goes
# through a constructed stylesheet rather than an element's style property —
# style-src refuses those whether they come from markup or from CSSOM.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
