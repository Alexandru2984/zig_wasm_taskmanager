# Rate-limit zones for task.micutu.com — http-level, so they live in conf.d.
# Deploy: sudo cp ops/nginx/task-rate-limit.conf /etc/nginx/conf.d/
#
# $binary_remote_addr is the real visitor address, not the Cloudflare edge:
# conf.d/cloudflare-realip.conf runs the real_ip module over Cloudflare's
# published ranges and rewrites $remote_addr from CF-Connecting-IP before
# these zones are evaluated.
#
# These sit IN FRONT of the application's own per-IP and per-account limiters
# rather than replacing them. The app's buckets are process memory and reset on
# every deploy or crash; nginx's survive that, and reject floods before they
# ever reach a worker thread or open a SurrealDB connection.

# Auth endpoints: login, signup, password reset, verification. Deliberately
# tight — the app allows 5 logins/min/IP, so 20/min here never rejects a
# legitimate user but does cap how fast a single address can probe.
limit_req_zone $binary_remote_addr zone=task_auth:10m rate=20r/m;

# Everything else under /api/. Generous: a normal session polls tasks and
# workspaces on every mutation.
limit_req_zone $binary_remote_addr zone=task_api:10m rate=600r/m;

# Concurrent connections per address, to bound slowloris-style holding.
limit_conn_zone $binary_remote_addr zone=task_conn:10m;

# Return 429 rather than the nginx default 503, so clients (and the app's own
# fetch error handling) can tell throttling apart from an outage.
limit_req_status 429;
limit_conn_status 429;
